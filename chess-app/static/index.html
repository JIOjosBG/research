<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chess</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;padding:16px;background:#222;color:#eee;display:flex;gap:24px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
#board{display:grid;grid-template-columns:repeat(8,min(11vw,64px));border:2px solid #555}
.sq{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:min(8vw,46px);cursor:pointer;user-select:none}
.l{background:#eed9b6;color:#000}.d{background:#b58863;color:#000}
.sel{outline:3px solid #4af;outline-offset:-3px}.tgt{box-shadow:inset 0 0 0 100px rgba(0,200,0,.3)}.chk{background:#e66}
.panel{width:260px}select,button{width:100%;margin:4px 0;padding:6px}
#hist{height:200px;overflow:auto;background:#111;padding:8px;font-family:monospace}
#status{margin:8px 0;font-weight:bold}
#cost{margin-top:12px;font-size:13px}#cost table{width:100%;border-collapse:collapse}
#cost td,#cost th{padding:2px 4px;text-align:right;border-bottom:1px solid #333}#cost td:first-child,#cost th:first-child{text-align:left}
#costlog{max-height:160px;overflow:auto}
#promo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);align-items:center;justify-content:center}
#promo div{background:#eed9b6;padding:12px;border-radius:8px;display:flex;gap:8px}
#promo span{font-size:52px;cursor:pointer;padding:4px 10px;border-radius:6px}#promo span:hover{background:#b58863}
</style></head><body>
<div id="board"></div>
<div class="panel">
 <h3>New game</h3>
 White <select id="w"><option value="human">Human</option></select>
 Black <select id="b"><option value="human">Human</option></select>
 <button onclick="loadModels(true)">Refresh model lists</button>
 <button onclick="newGame()">Start</button>
 <div id="status"></div><div id="hist"></div>
 <div id="cost"></div>
</div>
<div id="promo"><div></div></div>
<script>
const G={w:'♔♕♖♗♘♙',b:'♚♛♜♝♞♟'};
const SYM={K:'♚',Q:'♛',R:'♜',B:'♝',N:'♞',P:'♟',k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'};
let S=null,sel=null,busy=false;
const $=id=>document.getElementById(id);
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok)throw new Error(j.error);return j}
const spec=v=>{const [type,...m]=v.split('|');return {type,model:m.join('|')||undefined}};
async function newGame(){try{S=await api('/api/new',{white:spec($('w').value),black:spec($('b').value)});sel=null;render();loop()}catch(e){$('status').textContent=e.message}}
function isHuman(){return S.players[S.turn].type==='human'}
async function loop(){
 if(busy)return;busy=true;
 while(S&&!S.over&&!isHuman()){
  $('status').textContent=S.turn+' (AI) is thinking…';
  try{S=await api('/api/ai_move/'+S.id,{});render()}catch(e){$('status').textContent='AI error: '+e.message;busy=false;return}
 }
 busy=false;render();
}
function render(){
 const fen=S.fen.split(' ')[0].split('/');const sq=[];
 fen.forEach((row,r)=>{let f=0;for(const c of row){if(/\d/.test(c))for(let i=0;i<+c;i++)sq.push({r,f:f++,p:null});else sq.push({r,f:f++,p:c})}});
 const kingSq=S.check?sq.find(s=>s.p===(S.turn==='white'?'K':'k')):null;
 const tg=sel?S.legal.filter(m=>m.startsWith(sel)).map(m=>m.slice(2,4)):[];
 $('board').innerHTML='';
 for(const s of sq){const name='abcdefgh'[s.f]+(8-s.r);const d=document.createElement('div');
  d.className='sq '+((s.r+s.f)%2?'d':'l')+(sel===name?' sel':'')+(tg.includes(name)?' tgt':'')+(kingSq===s?' chk':'');
  if(s.p){d.textContent=SYM[s.p];d.style.color=s.p===s.p.toUpperCase()?'#fff':'#000';d.style.textShadow=s.p===s.p.toUpperCase()?'0 0 2px #000,0 0 2px #000,0 0 2px #000':'none'}
  d.onclick=()=>click(name,s.p);$('board').appendChild(d)}
 $('hist').textContent=S.history.map((m,i)=>(i%2?'':(i/2+1|0)+'. ')+m).join(' ');
 renderCost();
 if(S.over)$('status').textContent='Game over: '+S.result+' ('+S.outcome+')';
 else if(!busy)$('status').textContent=S.turn+' to move'+(S.check?' (check)':'');
}
async function click(name,p){
 if(!S||S.over||busy||!isHuman())return;
 const mine=p&&(p===p.toUpperCase())===(S.turn==='white');
 if(sel&&S.legal.some(m=>m.startsWith(sel+name))){
  let uci=sel+name;
  if(!S.legal.includes(uci)){const pc=await pickPromotion();if(!pc)return;uci+=pc}
  try{S=await api('/api/move/'+S.id,{uci});sel=null;render();loop()}catch(e){$('status').textContent=e.message}
 }else{sel=mine?name:null;render()}
}
const usd=v=>v==null?'n/a':'$'+v.toFixed(v<0.01?5:4);
function renderCost(){
 const ai=['white','black'].filter(c=>S.players[c].type!=='human');
 if(!ai.length){$('cost').innerHTML='';return}
 let h='<b>API cost (estimate)</b><table><tr><th>Side</th><th>In tok</th><th>Out tok</th><th>Cost</th></tr>';
 for(const c of ai){const t=S.totals[c];h+=`<tr><td>${c} (${who(c)})</td><td>${t.input_tokens}</td><td>${t.output_tokens}</td><td>${usd(t.cost_usd)}</td></tr>`}
 h+='</table><div id="costlog"><table><tr><th>Move</th><th>Req</th><th>In</th><th>Out</th><th>Cost</th></tr>';
 for(const x of [...S.costs].reverse())h+=`<tr><td>${(x.ply/2|0)+1}${x.color==='white'?'.':'...'} ${x.move??'(error)'}</td><td>${x.requests}</td><td>${x.input_tokens}</td><td>${x.output_tokens}</td><td>${usd(x.cost_usd)}</td></tr>`;
 $('cost').innerHTML=h+'</table></div>';
}
async function loadModels(refresh){
 $('status').textContent='Loading model lists…';
 let list;try{list=await api('/api/models'+(refresh?'?refresh=1':''))}catch(e){$('status').textContent=e.message;return}
 for(const id of ['w','b']){const sel=$(id),keep=sel.value;sel.innerHTML='<option value="human">Human</option>';
  for(const p of list){const g=document.createElement('optgroup');g.label=p.label;
   if(p.error){const o=new Option(p.label+': '+p.error,'');o.disabled=true;g.appendChild(o)}
   for(const m of p.models){const name=m.name.startsWith(p.label)?m.name:p.label+' – '+m.name;g.appendChild(new Option(name,p.type+'|'+m.id))}
   sel.appendChild(g)}
  if([...sel.options].some(o=>o.value===keep))sel.value=keep}
 $('status').textContent='';
}
loadModels(false);
const who=c=>{const p=S.players[c];return p.model?p.model:p.type};
function pickPromotion(){
 // Resolves with 'q','r','b','n', or null if the player cancels.
 return new Promise(res=>{const box=$('promo'),row=box.firstChild;row.innerHTML='';
  const white=S.turn==='white';
  for(const [k,w,b] of [['q','♕','♛'],['r','♖','♜'],['b','♗','♝'],['n','♘','♞']]){
   const sp=document.createElement('span');sp.textContent=white?w:b;sp.title=k;
   sp.onclick=e=>{e.stopPropagation();box.style.display='none';res(k)};row.appendChild(sp)}
  box.onclick=()=>{box.style.display='none';sel=null;render();res(null)};
  box.style.display='flex'})
}
</script></body></html>
